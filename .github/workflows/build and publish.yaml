on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v6
        with:
          path: main_repo
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
          cache: true
          cache-dependency-path: main_repo/Jellyfin.Plugin.MyAnimeList/packages.lock.json

      - name: Restore dependencies
        run: dotnet restore main_repo

      - name: Build Plugin
        run: dotnet build main_repo/Jellyfin.Plugin.MyAnimeList -c Release

      - name: Extract Version and ABI from csproj
        id: extract_version_abi
        run: |
          CSPROJ="main_repo/Jellyfin.Plugin.MyAnimeList/Jellyfin.Plugin.MyAnimeList.csproj"
          
          VERSION=$(dotnet msbuild "$CSPROJ" -nologo -v:q -getProperty:Version)
          TARGET_ABI=$(dotnet msbuild "$CSPROJ" -nologo -v:q -getItem:PackageReference \
            | grep "^PackageReference=Jellyfin.Controller " \
            | sed -E 's/.*Version=([^ ]+).*/\1/')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TARGET_ABI=${TARGET_ABI}" >> $GITHUB_ENV

      - name: Create ZIP
        run: |
          zip -j myanimelist_${VERSION}.zip main_repo/Jellyfin.Plugin.MyAnimeList/bin/Release/net9.0/*.dll

      - name: Generate MD5 Checksum for ZIP
        id: checksum
        run: |
          CHECKSUM=$(md5sum myanimelist_${{ env.VERSION }}.zip | awk '{ print $1 }')
          echo "CHECKSUM=${CHECKSUM}" >> $GITHUB_ENV

      - name: Update Manifest File
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq --arg version "${{ env.VERSION }}" \
             --arg changelog "https://github.com/ryandash/jellyfin-plugin-myanimelist/releases/tag/v${{ env.VERSION }}" \
             --arg checksum "${{ env.CHECKSUM }}" \
             --arg sourceUrl "https://github.com/ryandash/jellyfin-plugin-myanimelist/releases/download/v${{ env.VERSION }}/myanimelist_${{ env.VERSION }}.zip" \
             --arg targetAbi "${{ env.TARGET_ABI }}" \
             --arg timestamp "$TIMESTAMP" \
             '.[0].versions = [{
                version: $version,
                changelog: $changelog,
                targetAbi: $targetAbi,
                sourceUrl: $sourceUrl,
                checksum: $checksum,
                timestamp: $timestamp     
              }] + .[0].versions' main_repo/manifest.json > main_repo/manifest-updated.json

          mv main_repo/manifest-updated.json main_repo/manifest.json

      - name: Get Changelog
        id: changelog
        run: |
          cd main_repo
          git fetch --tags
          LAST_TAG=$(git tag -l | sort -V | tail -n 1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found, including all commits..."
            git log --pretty=format:"%h %B" --no-merges > CHANGELOG.txt
          else
            echo "Using last tag: $LAST_TAG"
            git log ${LAST_TAG}..HEAD --pretty=format:"%h %B" --no-merges > CHANGELOG.txt
          fi
          CHANGELOG_CONTENT=$(cat CHANGELOG.txt)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1.20.0
        with:
          tag: v${{ env.VERSION }}
          name: "Version ${{ env.VERSION }}"
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          artifacts: "myanimelist_${{ env.VERSION }}.zip"
          artifactContentType: "application/zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Manifest to Main
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update manifest"
          branch: main
          file_pattern: 'manifest.json CHANGELOG.txt'
          repository: main_repo
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "ryandash <ryandash@users.noreply.github.com>"
          skip_dirty_check: true
